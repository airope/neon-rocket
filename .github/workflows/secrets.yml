name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned scanner and verify release checksum
        shell: bash
        run: |
          curl --fail --location --silent --show-error -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          python3 -c "import hashlib,pathlib; p=pathlib.Path('gitleaks_8.30.1_linux_x64.tar.gz'); h=hashlib.sha256(p.read_bytes()).hexdigest(); assert any(h in line and p.name in line for line in pathlib.Path('gitleaks_8.30.1_checksums.txt').read_text().splitlines())"
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact=100
